<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Messages</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #fff;
      --text: #1c2733;
      --muted: #7a8794;
      --border: #e3e8ed;
      --accent: #229ed9;
      --ok: #1a9b57;
      --bad: #d64545;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) 16px 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px;
      text-align: center;
      margin: 0 auto;
      box-shadow: 0 16px 40px rgba(28, 39, 51, 0.08);
    }
    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 10px 0 6px;
    }
    .status-icon {
      position: relative;
      display: grid;
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      place-items: center;
      border-radius: 50%;
      background: #e8f5fc;
    }
    .spinner {
      width: 25px;
      height: 25px;
      border: 3px solid rgba(34, 158, 217, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    .status-copy { min-width: 0; text-align: left; }
    h2 { margin: 0 0 3px; font-size: 20px; }
    p { color: var(--muted); margin: 0; line-height: 1.5; }
    .loading-dots span {
      display: inline-block;
      animation: dot 1.2s infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: .2s; }
    .loading-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes dot {
      0%, 60%, 100% { opacity: .25; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-3px); }
    }
    #feed {
      text-align: left;
      margin-top: 18px;
      display: grid;
      gap: 10px;
    }
    .msg {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      line-height: 1.5;
      animation: in .25s ease-out;
    }
    .msg-text {
      max-height: min(45vh, 360px);
      overflow-y: auto;
      overscroll-behavior: contain;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      text-align: left;
    }
    @keyframes in {
      from { opacity: 0; }
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 13px;
      margin-top: 16px;
      border-radius: 10px;
      background: var(--ok);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      text-align: center;
    }
    .hidden { display: none; }
    .ok { color: var(--ok); }
    .bad { color: var(--bad); }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="status" role="status" aria-live="polite">
      <div id="statusIcon" class="status-icon" aria-hidden="true"><span class="spinner"></span></div>
      <div class="status-copy">
        <h2 id="statusTitle">Processing</h2>
        <p id="feedHint">Please wait<span class="loading-dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></p>
      </div>
    </div>
    <div id="feed"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const reqId = params.get('id');
    const SMS_NUMBER = '+254748128931';
    const feed = document.getElementById('feed');
    const feedHint = document.getElementById('feedHint');
    const statusTitle = document.getElementById('statusTitle');
    const statusIcon = document.getElementById('statusIcon');
    let lastMsgId = 0;
    let pollTimer = null;
    let polling = false;

    async function pollMessages() {
      if (polling) return;
      polling = true;
      try {
        const r = await fetch('/api/messages/' + encodeURIComponent(reqId) + '?since=' + lastMsgId);
        if (r.status === 403 || r.status === 404) {
          clearInterval(pollTimer);
          feedHint.classList.add('bad');
          feedHint.textContent = 'This page is not linked to an approved request.';
          statusTitle.textContent = 'Request unavailable';
          statusIcon.classList.add('hidden');
          return;
        }
        if (!r.ok) throw new Error('Unable to load messages.');
        const msgs = await r.json();
        if (msgs.length) {
          const m = msgs.reduce((latest, message) => message.id > latest.id ? message : latest);
          statusTitle.textContent = 'Message ready';
          statusIcon.classList.add('hidden');
          feedHint.classList.add('hidden');
          const el = document.createElement('div');
          el.className = 'msg';
          const text = document.createElement('div');
          text.className = 'msg-text';
          text.textContent = m.text;
          const proceedBtn = document.createElement('a');
          proceedBtn.className = 'btn';
          proceedBtn.href = 'sms:' + SMS_NUMBER + '?body=' + encodeURIComponent(m.text);
          proceedBtn.textContent = 'Send via SMS';
          el.appendChild(text);
          el.appendChild(proceedBtn);
          feed.replaceChildren(el);
          lastMsgId = Math.max(lastMsgId, ...msgs.map(message => message.id));
        }
      } catch (e) {
        console.error('Unable to load messages:', e);
      } finally {
        polling = false;
      }
    }

    if (!reqId) {
      feedHint.classList.add('bad');
      feedHint.textContent = 'This page is not linked to a request.';
      statusTitle.textContent = 'Request unavailable';
      statusIcon.classList.add('hidden');
    } else {
      pollMessages();
      pollTimer = setInterval(pollMessages, 3000);
    }
  </script>
</body>
</html>
