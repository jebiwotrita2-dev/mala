<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Messages</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #fff;
      --text: #1c2733;
      --muted: #7a8794;
      --border: #e3e8ed;
      --accent: #229ed9;
      --ok: #1a9b57;
      --bad: #d64545;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px;
      text-align: center;
    }
    h2 { margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 18px; line-height: 1.5; }
    #feed {
      text-align: left;
      margin-top: 18px;
      display: grid;
      gap: 10px;
    }
    .msg {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      white-space: pre-wrap;
      word-wrap: break-word;
      line-height: 1.5;
      animation: in .25s ease;
    }
    @keyframes in {
      from { opacity: 0; transform: translateY(-6px); }
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 13px;
      margin-top: 16px;
      border-radius: 10px;
      background: var(--ok);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      text-align: center;
    }
    .hidden { display: none; }
    .ok { color: var(--ok); }
  </style>
</head>
<body>
  <div class="card">
    <h2 class="ok">✅ Approved</h2>
    <p id="feedHint">Waiting for a message…</p>
    <div id="feed"></div>
    <a id="proceedBtn" class="btn hidden" target="_blank" rel="noopener">Proceed</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const reqId = params.get('id');
    const phone = params.get('phone') || '';
    const WHATSAPP_NUMBER = '254748128931';
    const proceedBtn = document.getElementById('proceedBtn');
    const feed = document.getElementById('feed');
    const feedHint = document.getElementById('feedHint');
    let lastMsgId = 0;

    function showProceed() {
      const who = phone || 'customer';
      proceedBtn.href = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent("Hi, it's " + who);
      proceedBtn.classList.remove('hidden');
    }

    async function pollMessages() {
      if (!reqId) return;
      try {
        const r = await fetch('/api/messages/' + reqId + '?since=' + lastMsgId);
        if (!r.ok) return;
        const msgs = await r.json();
        if (msgs.length) showProceed();
        msgs.forEach((m) => {
          feedHint.classList.add('hidden');
          const el = document.createElement('div');
          el.className = 'msg';
          el.textContent = m.text;
          feed.prepend(el);
          lastMsgId = Math.max(lastMsgId, m.id);
        });
      } catch (e) {}
    }

    pollMessages();
    setInterval(pollMessages, 3000);
  </script>
</body>
</html>
