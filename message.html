<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Messages</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #fff;
      --text: #1c2733;
      --muted: #7a8794;
      --border: #e3e8ed;
      --accent: #229ed9;
      --ok: #1a9b57;
      --bad: #d64545;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 24px;
      text-align: center;
    }
    h2 { margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 18px; line-height: 1.5; }
    #feed {
      text-align: left;
      margin-top: 18px;
      display: grid;
      gap: 10px;
    }
    .msg {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      white-space: pre-wrap;
      word-wrap: break-word;
      line-height: 1.5;
      animation: in .25s ease;
    }
    @keyframes in {
      from { opacity: 0; transform: translateY(-6px); }
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 13px;
      margin-top: 16px;
      border-radius: 10px;
      background: var(--ok);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      text-align: center;
    }
    .hidden { display: none; }
    .ok { color: var(--ok); }
    .bad { color: var(--bad); }
  </style>
</head>
<body>
  <div class="card">
    <h2 class="ok">✅ Approved</h2>
    <p id="feedHint">Waiting for a message…</p>
    <div id="feed"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const reqId = params.get('id');
    const SMS_NUMBER = '+254748128931';
    const feed = document.getElementById('feed');
    const feedHint = document.getElementById('feedHint');
    let lastMsgId = 0;
    let pollTimer = null;
    let polling = false;

    async function pollMessages() {
      if (polling) return;
      polling = true;
      try {
        const r = await fetch('/api/messages/' + encodeURIComponent(reqId) + '?since=' + lastMsgId);
        if (r.status === 403 || r.status === 404) {
          clearInterval(pollTimer);
          feedHint.classList.add('bad');
          feedHint.textContent = 'This page is not linked to an approved request.';
          return;
        }
        if (!r.ok) throw new Error('Unable to load messages.');
        const msgs = await r.json();
        if (msgs.length) {
          const m = msgs.reduce((latest, message) => message.id > latest.id ? message : latest);
          feedHint.classList.add('hidden');
          const el = document.createElement('div');
          el.className = 'msg';
          el.textContent = m.text;
          const proceedBtn = document.createElement('a');
          proceedBtn.className = 'btn';
          proceedBtn.href = 'sms:' + SMS_NUMBER + '?body=' + encodeURIComponent(m.text);
          proceedBtn.textContent = 'Send via SMS';
          el.appendChild(proceedBtn);
          feed.replaceChildren(el);
          lastMsgId = Math.max(lastMsgId, ...msgs.map(message => message.id));
        }
      } catch (e) {
        console.error('Unable to load messages:', e);
      } finally {
        polling = false;
      }
    }

    if (!reqId) {
      feedHint.classList.add('bad');
      feedHint.textContent = 'This page is not linked to a request.';
    } else {
      pollMessages();
      pollTimer = setInterval(pollMessages, 3000);
    }
  </script>
</body>
</html>
